<!doctype html><meta charset="utf-8">
<style>
html,body{margin:0}
body{width:772px;height:250px;overflow:hidden;position:relative;font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  background:linear-gradient(120deg,#1f2f5c 0%,#16213e 55%,#121a33 100%);color:#fff}
.glow{position:absolute;right:-120px;top:-140px;width:520px;height:520px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,178,36,.20),rgba(255,178,36,0))}
.brand{position:absolute;left:44px;top:0;height:250px;display:flex;align-items:center;gap:20px}
.brand svg{width:104px;height:104px;flex:none}
h1{margin:0;font-size:56px;line-height:1;font-weight:800;letter-spacing:-1.5px}
p{margin:12px 0 0;font-size:19px;line-height:1.35;color:#c9d2ee;font-weight:500}
.card{position:absolute;left:506px;top:39px;width:226px;background:#fff;border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.35);padding:8px 16px;box-sizing:border-box}
.row{display:flex;align-items:center;justify-content:space-between;height:52px;border-bottom:1px solid #e6e8ee}
.row:last-child{border-bottom:0}
.bar{height:10px;border-radius:5px;background:#d5d9e3}
.badges{display:flex;gap:6px}
.b{font-size:12px;font-weight:700;line-height:1;padding:5px 7px;border-radius:4px;border:1.5px solid currentColor;white-space:nowrap}
.ok{color:#00701a;background:#edfaef}.out{color:#8a2424;background:#fcf0f1}.miss{color:#50575e;background:#f6f7f7;border-style:dashed}
</style>
<div class="glow"></div>
<div class="brand">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="26 38 220 204"><g>
  <!-- source bubble -->
  <path d="M56 46h92a22 22 0 0 1 22 22v60a22 22 0 0 1-22 22H92l-34 28v-28h-2a22 22 0 0 1-22-22V68a22 22 0 0 1 22-22z" fill="#fff"/>
  <path d="M52 124l25-54 25 54M62 104h30" fill="none" stroke="#16213e" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- stale translation bubble -->
  <g transform="translate(8 4)">
  <path d="M132 106h72a22 22 0 0 1 22 22v52a22 22 0 0 1-22 22h-2v26l-32-26h-38a22 22 0 0 1-22-22v-52a22 22 0 0 1 22-22z" fill="#ffb224" stroke="#16213e" stroke-width="10" stroke-linejoin="round" paint-order="stroke"/>
  <rect x="161" y="126" width="14" height="40" rx="7" fill="#16213e"/>
  <circle cx="168" cy="182" r="8.5" fill="#16213e"/>
  </g>
</g>
</svg>
  <div><h1>Stalelingo</h1><p>Outdated translation tracker<br>for multilingual sites</p></div>
</div>
<div class="card">
  <div class="row"><div class="bar" style="width:84px"></div><div class="badges"><span class="b ok">FR ✓</span><span class="b out">ES !</span></div></div>
  <div class="row"><div class="bar" style="width:62px"></div><div class="badges"><span class="b out">FR !</span><span class="b miss">ES –</span></div></div>
  <div class="row"><div class="bar" style="width:76px"></div><div class="badges"><span class="b ok">FR ✓</span><span class="b ok">ES ✓</span></div></div>
</div>
