# Translation Drift development stack.
# Everything (build, lint, tests) runs inside these containers; the host needs only Docker, Compose v2 and make.

name: translation-drift

x-plugin-mount: &plugin-mount
  type: bind
  source: .
  target: /var/www/html/wp-content/plugins/translation-drift

x-mu-plugins-mount: &mu-plugins-mount
  type: bind
  source: ./docker/mu-plugins
  target: /var/www/html/wp-content/mu-plugins
  read_only: true

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DEBUG: 1
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_DEBUG_LOG', true );
    define( 'WP_DEBUG_DISPLAY', false );
    define( 'SCRIPT_DEBUG', true );
    define( 'WP_ENVIRONMENT_TYPE', 'local' );
    define( 'WP_HOME', 'http://localhost:${WP_PORT:-8080}' );
    define( 'WP_SITEURL', 'http://localhost:${WP_PORT:-8080}' );

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:php${PHP_VERSION:-8.3}-apache
    depends_on:
      db:
        condition: service_healthy
    # Apache listens on the same port inside and outside the container, so WP_HOME
    # (http://localhost:8080) resolves for the browser on the host, for WordPress
    # loopback requests (WP-Cron), and for Playwright, which shares this network namespace.
    command:
      - bash
      - -c
      - >-
        sed -ri "s/^Listen 80$$/Listen ${WP_PORT:-8080}/" /etc/apache2/ports.conf &&
        sed -ri "s/<VirtualHost \*:80>/<VirtualHost *:${WP_PORT:-8080}>/" /etc/apache2/sites-available/000-default.conf &&
        exec docker-entrypoint.sh apache2-foreground
    ports:
      - "${WP_PORT:-8080}:${WP_PORT:-8080}"
    environment: *wp-env
    volumes:
      - wp_data:/var/www/html
      - *plugin-mount
      - *mu-plugins-mount
    healthcheck:
      test: [ "CMD-SHELL", "test -f /var/www/html/wp-config.php" ]
      interval: 3s
      timeout: 3s
      retries: 40

  wpcli:
    image: wordpress:cli
    profiles: [ tools ]
    # Match the uid of www-data in the Debian-based wordpress image (the CLI image is Alpine, uid 82).
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wp-env
      HOME: /tmp
      PROVIDER: ${PROVIDER:-polylang}
      WP_PORT: ${WP_PORT:-8080}
      WPML_ZIP_PATH: ${WPML_ZIP_PATH:-}
    working_dir: /var/www/html
    volumes:
      - wp_data:/var/www/html
      - *plugin-mount
      - *mu-plugins-mount
      - ./private:/private:ro

  php:
    build:
      context: ./docker/php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
    profiles: [ tools ]
    depends_on:
      db:
        condition: service_healthy
    environment:
      COMPOSER_HOME: /tmp/composer
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      WP_VERSION: ${WP_VERSION:-latest}
      WP_TESTS_DIR: /opt/wp-tests/lib
      WP_CORE_DIR: /opt/wp-tests/core
      WP_TESTS_DB_HOST: db
      WP_TESTS_DB_NAME: wordpress_test
      WP_TESTS_DB_USER: wordpress
      WP_TESTS_DB_PASS: wordpress
      PROVIDER: ${PROVIDER:-polylang}
    working_dir: /app
    volumes:
      - .:/app
      - wp_tests:/opt/wp-tests
      - composer_cache:/tmp/composer-cache
      - ./private:/private:ro

  node:
    image: node:22
    profiles: [ tools ]
    working_dir: /app
    environment:
      npm_config_cache: /tmp/npm-cache
    volumes:
      - .:/app
      - npm_cache:/tmp/npm-cache

  playwright:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: [ tools ]
    # Share the WordPress container's network namespace so http://localhost:8080 works as it does on the host.
    network_mode: "service:wordpress"
    working_dir: /app
    environment:
      WP_BASE_URL: http://localhost:${WP_PORT:-8080}
      MAILPIT_URL: http://mailpit:8025
      PROVIDER: ${PROVIDER:-polylang}
      CI: ${CI:-}
    volumes:
      - .:/app
    ipc: host

  # Clean WordPress for the release smoke test (`make zip-smoke`): no plugin bind mount and
  # no dev mu-plugins. The plugin is installed from the zip in dist/, as a site owner would.
  wordpress-zip:
    image: wordpress:php${PHP_VERSION:-8.3}-apache
    profiles: [ zip ]
    depends_on:
      db:
        condition: service_healthy
    command:
      - bash
      - -c
      - >-
        sed -ri "s/^Listen 80$$/Listen 8081/" /etc/apache2/ports.conf &&
        sed -ri "s/<VirtualHost \*:80>/<VirtualHost *:8081>/" /etc/apache2/sites-available/000-default.conf &&
        exec docker-entrypoint.sh apache2-foreground
    ports:
      - "8081:8081"
    environment: &wp-zip-env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: wordpress_zip
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'WP_HOME', 'http://localhost:8081' );
        define( 'WP_SITEURL', 'http://localhost:8081' );
    volumes:
      - wp_zip_data:/var/www/html
    healthcheck:
      test: [ "CMD-SHELL", "test -f /var/www/html/wp-config.php" ]
      interval: 3s
      timeout: 3s
      retries: 40

  wpcli-zip:
    image: wordpress:cli
    profiles: [ zip ]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wp-zip-env
      HOME: /tmp
    working_dir: /var/www/html
    volumes:
      - wp_zip_data:/var/www/html
      - ./dist:/dist:ro
      # Test tooling only (languages and seed scripts); nothing here reaches the site's plugin folder.
      - ./bin:/tools:ro

  playwright-zip:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: [ zip ]
    network_mode: "service:wordpress-zip"
    working_dir: /app
    environment:
      WP_BASE_URL: http://localhost:8081
      CI: ${CI:-}
    volumes:
      - .:/app
    ipc: host

  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  db_data:
  wp_data:
  wp_zip_data:
  wp_tests:
  composer_cache:
  npm_cache:
